<body>
    <!-- Elemen Audio & Butang Kawalan -->
<audio id="bgMusic" loop>
    <source src="https://soundhelix.com" type="audio/mp3">
    Browser anda tidak menyokong elemen audio.
</audio>
<button id="musicBtn" class="music-control-btn">🎵 Pasang Muzik</button>

<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Perkahwinan Amir & Sarah</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan Font Google yang Romantik -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- Seksyen 1: Hero / Pengenalan -->
    <header class="hero">
        <div class="hero-content">
            <p class="sub-title">Walimatulurus</p>
            <h1>Amirul & Hayati</h1>
            <p class="date">Sabtu, 20 Mac 2026</p>
            <div id="countdown" class="countdown"></div>
            <a href="#rsvp" class="btn">Sahkan Kehadiran</a>
        </div>
    </header>

    <!-- Seksyen 2: Butiran Majlis & Navigasi -->
    <section class="details">
        <h2>Butiran Majlis</h2>
        <p><strong>Tarikh:</strong> 20 Mac 2026 (Sabtu)</p>
        <p><strong>Masa:</strong> 11:00 Pagi - 4:00 Petang</p>
        <p><strong>Tempat:</strong> Ruby Hall, Taman Kota Masai, Pasir Gudang</p>
        
        <div class="maps-buttons">
            <a href="https://ul.waze.com/ul?place=ChIJU5Txlv1B2jERefTqDxgETMw&ll=1.48302120%2C103.93889270&navigate=yes" target="_blank" class="btn-map Waze">Waze</a>
            <a href="https://maps.app.goo.gl/hWxqCK6g2WNbJKLEA" target="_blank" class="btn-map Google">Google Maps</a>
        </div>
    </section>

    <!-- Seksyen 3: Borang RSVP Interaktif -->
    <section id="rsvp" class="rsvp-section">
        <h2>Borang RSVP</h2>
        <form id="rsvpForm">
            <input type="text" id="nama" placeholder="Nama Anda" required>
            <select id="kehadiran" required>
                <option value="">Adakah anda akan hadir?</option>
                <option value="Hadir">Hadir</option>
                <option value="Tidak Hadir">Tidak hadir</option>
            </select>
            <input type="number" id="pax" placeholder="Bilangan Pax (Maksimum 4)" min="1" max="4">
            <button type="submit" class="btn">Hantar RSVP</button>
        </form>
        <div id="rsvpStatus" class="status-msg"></div>
    </section>

    <script src="script.js"></script>
</body>
</html>
